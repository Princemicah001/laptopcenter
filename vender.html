<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LTECH Vendor Console</title>
    <style>
        :root {
            --ink: #101012;
            --muted: #727278;
            --line: #e4e4e7;
            --soft: #f5f5f7;
            --blue: #0071e3
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--soft);
            color: var(--ink);
            font-family: Inter, ui-sans-serif, system-ui, sans-serif
        }

        button,
        input,
        textarea {
            font: inherit
        }

        button {
            cursor: pointer
        }

        .wrap {
            width: min(1320px, calc(100% - 32px));
            margin: auto
        }

        .top {
            background: #fff;
            border-bottom: 1px solid var(--line);
            padding: 20px 0
        }

        .top-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px
        }

        .logo {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: -.06em
        }

        .top a {
            color: var(--muted);
            font-size: 12px;
            text-decoration: none
        }

        .layout {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 18px;
            padding: 28px 0
        }

        .panel,
        .product {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 18px
        }

        .panel {
            padding: 20px;
            position: sticky;
            top: 18px;
            height: max-content
        }

        .panel h1 {
            font-size: 28px;
            line-height: 1;
            margin: 0 0 8px;
            letter-spacing: -.06em
        }

        .panel p,
        .hint {
            font-size: 12px;
            color: var(--muted);
            line-height: 1.6
        }

        .form {
            display: grid;
            gap: 10px;
            margin-top: 20px
        }

        .form label {
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .1em;
            color: #777
        }

        .form input,
        .form textarea {
            width: 100%;
            border: 1px solid #d8d8dc;
            border-radius: 10px;
            padding: 11px;
            outline: 0;
            font-size: 12px
        }

        .form textarea {
            min-height: 70px;
            resize: vertical
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px
        }

        .actions {
            display: flex;
            gap: 8px;
            margin-top: 6px
        }

        .btn {
            border: 0;
            border-radius: 999px;
            padding: 12px 16px;
            font-size: 11px;
            font-weight: 800
        }

        .primary {
            background: #111;
            color: #fff
        }

        .secondary {
            background: #fff;
            border: 1px solid var(--line)
        }

        .status {
            min-height: 18px;
            font-size: 11px;
            color: var(--blue);
            margin-top: 10px
        }

        .products-head {
            display: flex;
            align-items: end;
            justify-content: space-between;
            margin-bottom: 12px
        }

        .products-head h2 {
            margin: 0;
            font-size: 24px;
            letter-spacing: -.05em
        }

        .products-head span {
            font-size: 11px;
            color: var(--muted)
        }

        .product-list {
            display: grid;
            gap: 10px
        }

        .product {
            display: grid;
            grid-template-columns: 88px 1fr auto;
            align-items: center;
            gap: 15px;
            padding: 12px
        }

        .product img {
            width: 88px;
            height: 72px;
            object-fit: contain;
            background: var(--soft);
            border-radius: 10px
        }

        .product h3 {
            font-size: 15px;
            margin: 0 0 4px
        }

        .product p {
            font-size: 11px;
            color: var(--muted);
            margin: 0
        }

        .product-price {
            font-size: 14px;
            font-weight: 800;
            text-align: right
        }

        .product-price small {
            display: block;
            color: #999;
            font-size: 10px;
            font-weight: 500;
            margin-top: 4px
        }

        .product button {
            margin-top: 8px;
            border: 1px solid var(--line);
            background: #fff;
            border-radius: 999px;
            padding: 7px 10px;
            font-size: 10px;
            font-weight: 800
        }

        .empty {
            background: #fff;
            border: 1px dashed #ccc;
            border-radius: 18px;
            padding: 30px;
            color: var(--muted);
            text-align: center;
            font-size: 12px
        }

        @media(max-width:850px) {
            .layout {
                grid-template-columns: 1fr
            }

            .panel {
                position: static
            }

            .product {
                grid-template-columns: 65px 1fr
            }

            .product img {
                width: 65px;
                height: 60px
            }

            .product-price {
                grid-column: 2;
                text-align: left
            }

            .top-inner {
                align-items: flex-start;
                flex-direction: column
            }
        }
    </style>
</head>

<body>
    <header class="top">
        <div class="wrap top-inner">
            <div class="logo">LTECH / VENDOR</div><a href="/">View storefront</a>
        </div>
    </header>
    <main class="wrap layout">
        <section class="panel">
            <h1>Manage products.</h1>
            <p>Add affordable ThinkPad T-series models, change prices, replace images, or update specifications. Static
                catalog changes are downloaded as <strong>products.json</strong> for publishing.</p>
            <form class="form" id="productForm">
                <input type="hidden" id="productId">
                <label for="brand">Brand</label><input id="brand" required placeholder="Lenovo">
                <label for="name">Model name</label><input id="name" required placeholder="ThinkPad T480">
                <div class="row">
                    <div><label for="generation">Generation</label><input id="generation" required
                            placeholder="8th Gen"></div>
                    <div><label for="price">Price (KSh)</label><input id="price" required type="number" min="0"
                            step="100" placeholder="35000"></div>
                </div>
                <div class="row">
                    <div><label for="oldPrice">Old price</label><input id="oldPrice" type="number" min="0" step="100"
                            placeholder="40000"></div>
                    <div><label for="badge">Badge</label><input id="badge" placeholder="VALUE PICK"></div>
                </div>
                <label for="image">Image URL</label><input id="image" required type="url" placeholder="https://...">
                <label for="description">Description</label><textarea id="description" required
                    placeholder="Short product description"></textarea>
                <label for="specs">Specifications</label><input id="specs" required
                    placeholder="Core i5 8th Gen, 8GB, 256GB SSD, 14 inch">
                <label for="features">Features / filters</label><input id="features"
                    placeholder="student, business, budget">
                <div class="actions"><button class="btn primary" type="submit">Download catalog</button><button
                        class="btn secondary" type="button" id="clear">Clear</button></div>
                <div class="status" id="status" role="status"></div>
            </form>
        </section>
        <section>
            <div class="products-head">
                <h2>Catalog</h2><span id="productCount"></span>
            </div>
            <div class="product-list" id="productList"></div>
        </section>
    </main>
    <script>
        const form = document.getElementById('productForm'), list = document.getElementById('productList'), status = document.getElementById('status'), count = document.getElementById('productCount');
        let products = [];
        const catalogChannel = 'ltech-catalog';
        const syncCatalog = 'BroadcastChannel' in window ? new BroadcastChannel(catalogChannel) : null;
        const fields = ['productId', 'brand', 'name', 'generation', 'price', 'oldPrice', 'badge', 'image', 'description', 'specs', 'features'];
        const input = id => document.getElementById(id);
        function showStatus(message, error = false) { status.textContent = message; status.style.color = error ? '#c40000' : '#0071e3' }
        function resetForm() { form.reset(); input('productId').value = ''; showStatus('') }
        function render() { count.textContent = `${products.length} products`; list.innerHTML = products.map(product => `<article class="product"><img src="${product.image}" alt="${product.brand} ${product.name}"><div><h3>${product.brand} ${product.name}</h3><p>${product.generation} · ${(product.specs || []).join(' · ')}</p><button type="button" onclick="editProduct('${product.id}')">Edit</button><button type="button" onclick="removeProduct('${product.id}')">Delete</button></div><div class="product-price">KSh ${Number(product.price).toLocaleString('en-KE')}<small>${product.features.join(' · ')}</small></div></article>`).join('') || '<div class="empty">No products yet. Add the first one.</div>' }
        function fill(product) { fields.forEach(field => { if (field === 'specs' || field === 'features') input(field).value = (product[field] || []).join(', '); else input(field).value = product[field] || '' }); window.scrollTo({ top: 0, behavior: 'smooth' }) }
        function notifyCatalogChange() {
            const timestamp = Date.now().toString();
            localStorage.setItem('ltech-catalog-updated', timestamp);
            if (syncCatalog) syncCatalog.postMessage({ type: 'catalog-updated', timestamp });
        }
        window.editProduct = id => { const product = products.find(item => item.id === id); if (product) fill(product) };
        window.removeProduct = id => { if (confirm('Delete this product?')) { products = products.filter(product => product.id !== id); save() } };
        function save() {
            localStorage.setItem('ltech-products', JSON.stringify(products));
            const file = new Blob([`${JSON.stringify(products, null, 2)}\n`], { type: 'application/json' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(file);
            link.download = 'products.json';
            link.click();
            URL.revokeObjectURL(link.href);
            notifyCatalogChange();
            render();
            showStatus('Catalog downloaded as products.json. Replace the published file to deploy it.');
        }
        form.addEventListener('submit', async event => { event.preventDefault(); const product = { id: input('productId').value || `${input('brand').value}-${input('name').value}`.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''), brand: input('brand').value.trim(), name: input('name').value.trim(), generation: input('generation').value.trim(), description: input('description').value.trim(), features: input('features').value.split(',').map(value => value.trim().toLowerCase()).filter(Boolean), specs: input('specs').value.split(',').map(value => value.trim()).filter(Boolean), price: Number(input('price').value), image: input('image').value.trim(), badge: input('badge').value.trim() || 'LTECH PICK' }; const oldPrice = Number(input('oldPrice').value); if (oldPrice) product.oldPrice = oldPrice; const index = products.findIndex(item => item.id === product.id); if (index < 0) products.push(product); else products[index] = product; try { await save(); resetForm() } catch (error) { showStatus(error.message, true) } });
        document.getElementById('clear').onclick = resetForm;
        const savedProducts = localStorage.getItem('ltech-products');
        if (savedProducts) {
            try { products = JSON.parse(savedProducts); render() } catch { localStorage.removeItem('ltech-products') }
        }
        if (!products.length) fetch('products.json').then(response => response.json()).then(data => { products = data; render() }).catch(() => showStatus('Could not load products.json.', true));
    </script>
</body>

</html>
